name: Rigid-body Simulation Checks

on:
  pull_request:
    paths:
      - "simulation/**"
      - "firmware/bench-imu-01-rev5/**"
      - "docs/rev5-public-release/software*"
      - "docs/rev5-six-imu-fault-study-2026-09-13/author/run-001/one-bias/**"
      - "tools/tests/test_rev5_public_software.py"
      - "tools/public_release_manifest.py"
      - "tools/tests/test_public_release_manifest.py"
      - "tools/tests/test_rev5_selected_bosch.py"
      - "docs/rev5-offline-tools-release/**"
      - "tools/tests/test_rev5_offline_publication.py"
      - "visualization/index*.html"
      - "docs/language-coverage.json"
      - "docs/pages*.md"
      - "AGENTS.md"
      - "AGENTS.ja.md"
      - ".github/workflows/simulation-check.yml"
  push:
    branches: [main]
    paths:
      - "simulation/**"
      - "firmware/bench-imu-01-rev5/**"
      - "docs/rev5-public-release/software*"
      - "docs/rev5-six-imu-fault-study-2026-09-13/author/run-001/one-bias/**"
      - "tools/tests/test_rev5_public_software.py"
      - "tools/public_release_manifest.py"
      - "tools/tests/test_public_release_manifest.py"
      - "tools/tests/test_rev5_selected_bosch.py"
      - "docs/rev5-offline-tools-release/**"
      - "tools/tests/test_rev5_offline_publication.py"
      - "visualization/index*.html"
      - "docs/language-coverage.json"
      - "docs/pages*.md"
      - "AGENTS.md"
      - "AGENTS.ja.md"
      - ".github/workflows/simulation-check.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  numerical-regressions:
    name: Simulation numerical and evidence regressions (not hardware approval)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: simulation/requirements-lock.txt
      - name: Install declared dependencies
        run: python -m pip install -r simulation/requirements-lock.txt
      - name: Run CPU numerical and provenance cases
        working-directory: simulation
        run: python -m unittest discover -s tests -v
      - name: Check public offline IMU closure and original tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -B -S -m unittest discover -s simulation/imu_disagreement/tests -v
          python -B -S -m unittest discover -s tools/tests -p 'test_rev5_offline_publication.py' -v
      - name: Check curated Rev5 public software (no SDK or hardware)
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -B -m unittest discover -s tools/tests -p 'test_rev5_public_software.py' -v
          python -B -m unittest tools.tests.test_public_release_manifest -v
          cmake --version
          export REV5_EVAL_CMAKE="$(command -v cmake)"
          export REV5_EVAL_TEST_SCRATCH="$(mktemp -d "$RUNNER_TEMP/rev5-n8r8.XXXXXX")"
          python -B firmware/bench-imu-01-rev5/evaluation/n8r8/tests/test_profile.py -v
          python -B -m unittest tools.tests.test_rev5_selected_bosch -v
      - name: Check selected Bosch HIGH corrections (host only, C3 remains open)
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -B firmware/bench-imu-01-rev5/evaluation/bosch-reviewed-candidate/test_runner.py -v
          scratch="$(mktemp -d "$RUNNER_TEMP/rev5-bosch.XXXXXX")"
          scratch="$(cd "$scratch" && pwd -P)"
          python -B firmware/bench-imu-01-rev5/evaluation/bosch-reviewed-candidate/run_host.py \
            --bmi2 firmware/bench-imu-01-rev5/measurement/vendor/bosch/bmi2.c \
            --expected-sha256 4ad4f91eb09f380df678e2bf1098e4140092337a442390e98915f43b9b302204 \
            --output-root "$scratch" --output "$scratch/host"
