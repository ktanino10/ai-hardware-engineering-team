name: Hardware Gate

# Enforces docs/architecture.md section 8 (Design Complete Gate):
# a PR touching design/validation artifacts must not carry an unresolved
# CRITICAL finding, or a HIGH finding without RESOLVED/ACCEPTED-RISK status,
# in validation/open-issues.md.

# NOTE (pull_request trigger is deliberately NOT path-filtered): this job's
# name, "Check open-issues.md for unresolved CRITICAL/HIGH findings", is one of
# three REQUIRED status checks on `main`. GitHub never reports a required check
# that a path filter skipped -- it stays "Expected" forever, leaving the PR
# permanently mergeStateStatus=BLOCKED, landable only via an admin override.
# Because all three required checks were path-filtered, a PR had to touch all
# three disjoint path sets to be mergeable at all; PR #25 hit exactly this and
# was merged by admin bypass. This check validates the whole of
# validation/open-issues.md regardless of which files a PR touched, and runs in
# ~15s, so running it on every PR is both cheap and strictly safer. The `push`
# trigger below keeps its path filter -- required-check semantics don't apply
# there, and a targeted signal on `main` is still useful.

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "validation/**"
      - "hardware/**"
      - "bom/**"
      - "requirements/**"
      - "tools/check_open_issues.py"
  workflow_dispatch: {}

jobs:
  open-issues-gate:
    name: Check open-issues.md for unresolved CRITICAL/HIGH findings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Run hardware gate check
        run: python3 tools/check_open_issues.py
