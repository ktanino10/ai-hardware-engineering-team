name: Deploy visualization to GitHub Pages

# Publishes the static, dependency-free pages under visualization/ (the
# Bench-IMU-01 circuit/current-flow viewer, and any future viewers added
# alongside it) to GitHub Pages. No build step — these are plain
# HTML/CSS/vanilla-JS files served as-is.

on:
  push:
    branches: [main]
    paths:
      - 'visualization/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload visualization/ as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'visualization'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
