name: Agent Frontmatter Lint

# Guards against a repeat of the mistakes fixed by hand in PR #2 and PR #3:
# every .github/agents/*.agent.md must have a non-empty `description`, and
# every .github/skills/*/SKILL.md must have a non-empty `name` (matching its
# directory) + `description`. See tools/check_agent_frontmatter.py.
#
# This is a separate workflow from hardware-gate.yml on purpose -- it is a
# repo-hygiene guard covering every discipline's agents/skills equally, not
# part of the Design Complete gate logic.

# NOTE (pull_request trigger is deliberately NOT path-filtered): this job's
# name, "Check agent/skill frontmatter", is a REQUIRED status check on `main`,
# and GitHub never reports a required check that a path filter skipped -- see
# the equivalent note in hardware-gate.yml. This was the binding constraint in
# practice: most PRs touch neither `.github/agents/**` nor `.github/skills/**`,
# so this check was the one that silently held them at "Expected" forever. The
# script validates every agent profile and skill in the repo regardless of what
# a PR touched, and runs in ~15s. The `push` trigger keeps its path filter.

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - ".github/agents/**"
      - ".github/skills/**"
      - "tools/check_agent_frontmatter.py"
  workflow_dispatch: {}

jobs:
  frontmatter-lint:
    name: Check agent/skill frontmatter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install PyYAML
        run: pip install pyyaml
      - name: Run frontmatter lint
        run: python3 tools/check_agent_frontmatter.py
